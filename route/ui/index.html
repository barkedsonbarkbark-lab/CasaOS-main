<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CasaOS Control Center</title>
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#171c22;--text:#eef2f6;--muted:#8e99a6;--line:#252c35;--accent:#8be28b;--danger:#ff6b6b;--shadow:0 16px 45px rgba(0,0,0,.24)}
[data-theme=light]{--bg:#f4f6f8;--panel:#fff;--panel2:#eef2f5;--text:#17202a;--muted:#687481;--line:#dce2e7;--accent:#168b42;--shadow:0 12px 35px rgba(20,30,40,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,rgba(139,226,139,.10),transparent 35%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:245px;border-right:1px solid var(--line);background:rgba(10,13,16,.78);backdrop-filter:blur(20px);padding:18px 12px;position:fixed;inset:0 auto 0 0}.light .side{background:rgba(255,255,255,.85)}.brand{display:flex;align-items:center;gap:11px;padding:10px 10px 22px;font-weight:800;font-size:18px}.logo{width:35px;height:35px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#56b8ff);display:grid;place-items:center;color:#07110a;font-weight:900}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:12px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.bottom{position:absolute;bottom:18px;left:12px;right:12px}.main{margin-left:245px;width:calc(100% - 245px);padding:22px 26px 45px}.top{display:flex;align-items:center;gap:15px;justify-content:space-between;margin-bottom:24px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px}.btn.primary{background:var(--accent);color:#08130a;border-color:transparent;font-weight:700}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,var(--panel),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:28px;font-weight:800;margin-top:8px}.muted{color:var(--muted)}.progress{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;background:var(--accent);border-radius:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}.pill.ok{color:var(--accent)}.pill.bad{color:var(--danger)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.input,.textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;outline:none}.input:focus,.textarea:focus{border-color:var(--accent)}.small{max-width:250px}.textarea{min-height:260px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.app{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}.apphead{display:flex;justify-content:space-between;align-items:center}.appicon{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:20px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}.modalbox{width:min(780px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);padding:12px 15px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:30}.toast.show{display:block}.gallery{columns:4 180px;column-gap:12px}.media{break-inside:avoid;margin:0 0 12px;border-radius:13px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}.media img{width:100%;display:block}.media div{padding:8px}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:900px){.side{width:72px}.brand span,.nav button span,.bottom .hide-mobile{display:none}.main{margin-left:72px;width:calc(100% - 72px);padding:16px}.nav button{text-align:center}.span3,.span4,.span6,.span8{grid-column:span 12}.gallery{columns:2 150px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><div class="logo">C</div><span>CasaOS</span></div><nav class="nav" id="nav"></nav><div class="bottom"><button class="navbtn btn" onclick="page('settings')">⚙ <span>Settings</span></button></div></aside><main class="main"><div class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><p id="pageSub">A modern server control center</p></div><div class="actions"><button class="btn" onclick="globalSearch()">⌕ Search</button><button class="btn" onclick="toggleTheme()">◐</button><button class="btn primary" onclick="refresh()">Refresh</button></div></div><section id="view"></section></main></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div>
<script>
const state={token:localStorage.getItem('casa_token')||'',theme:localStorage.getItem('casa_theme')||'dark',path:'/DATA',files:[],containers:[]};
document.documentElement.dataset.theme=state.theme;
const navItems=[['dashboard','⌂','Dashboard'],['apps','▦','Apps'],['files','□','Files'],['gallery','▧','Gallery'],['storage','◫','Storage'],['system','◉','System'],['settings','⚙','Settings']];
const nav=document.getElementById('nav');nav.innerHTML=navItems.map(x=>`<button id="n-${x[0]}" onclick="page('${x[0]}')">${x[1]} <span>${x[2]}</span></button>`).join('');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
async function api(path,opt={}){let h=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(state.token)h.Authorization=state.token.startsWith('Bearer ')?state.token:'Bearer '+state.token;const r=await fetch(path,{...opt,headers:h});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={data:t,message:r.statusText,success:r.status}}if(!r.ok)throw new Error(j.message||t||r.statusText);return j}
function page(p){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+p)?.classList.add('active');({dashboard:dashboard,apps:apps,files:files,gallery:gallery,storage:storage,system:system,settings:settings}[p]||dashboard)()}
function header(t,s){document.getElementById('pageTitle').textContent=t;document.getElementById('pageSub').textContent=s}
async function dashboard(){header('Dashboard','Overview of your CasaOS server');document.getElementById('view').innerHTML=`<div class="grid"><div class="card span3"><div class="muted">CPU</div><div class="metric" id="cpu">—</div><div class="progress"><i id="cpup" style="width:0%"></i></div></div><div class="card span3"><div class="muted">Memory</div><div class="metric" id="mem">—</div><div class="progress"><i id="memp" style="width:0%"></i></div></div><div class="card span3"><div class="muted">Temperature</div><div class="metric" id="temp">—</div></div><div class="card span3"><div class="muted">Architecture</div><div class="metric" id="arch">—</div></div><div class="card span8"><h3>System health</h3><div id="health"></div></div><div class="card span4"><h3>Quick actions</h3><div class="row"><span>File manager</span><button class="btn" onclick="page('files')">Open</button></div><div class="row"><span>Docker apps</span><button class="btn" onclick="page('apps')">Manage</button></div><div class="row"><span>Storage</span><button class="btn" onclick="page('storage')">Inspect</button></div><div class="row"><span>System</span><button class="btn" onclick="page('system')">Details</button></div></div></div>`;loadMetrics();loadHealth()}
async function loadMetrics(){try{const j=await api('/v1/sys/utilization');const d=j.data||{};const cpu=d.cpu||{},mem=d.mem||{};const cp=Number(cpu.percent||0);document.getElementById('cpu').textContent=Math.round(cp)+'%';document.getElementById('cpup').style.width=Math.min(100,cp)+'%';const used=Number(mem.used||mem.Used||0),total=Number(mem.total||mem.Total||0),mp=total?used/total*100:0;document.getElementById('mem').textContent=total?(mp.toFixed(0)+'%'):JSON.stringify(mem);document.getElementById('memp').style.width=Math.min(100,mp)+'%';document.getElementById('temp').textContent=(cpu.temperature??'—')+(cpu.temperature!=null?'°C':'');}catch(e){toast('Metrics: '+e.message)}}
async function loadHealth(){try{const j=await api('/v2/casaos/health/services');const d=j.data||[];document.getElementById('health').innerHTML=(Array.isArray(d)?d:[]).map(x=>`<div class="row"><span>${esc(x.name||x.service||JSON.stringify(x))}</span><span class="pill ok">${esc(x.status||x.state||'OK')}</span></div>`).join('')||'<div class="empty">No service health data</div>'}catch(e){document.getElementById('health').innerHTML='<div class="empty">Health endpoint unavailable: '+esc(e.message)+'</div>'}}
async function apps(){header('Apps','Docker applications, discovery and Compose');document.getElementById('view').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="showAppTab('installed')">Installed</button><button class="btn" onclick="showAppTab('store')">App Store</button><button class="btn" onclick="composeModal()">＋ Compose</button></div><div id="appbody"></div>`;showAppTab('installed')}
function showAppTab(tab){if(tab==='store'){document.getElementById('appbody').innerHTML=`<div class="toolbar"><input class="input small" id="storefilter" placeholder="Search apps" oninput="renderStore()"></div><div class="appgrid" id="store"></div>`;renderStore()}else{document.getElementById('appbody').innerHTML=`<div class="toolbar"><input class="input small" id="appfilter" placeholder="Filter containers" oninput="renderContainers()"><button class="btn" onclick="loadContainers()">Refresh</button></div><div class="appgrid" id="containers"></div>`;loadContainers()}}
const storeApps=[
{name:'Nginx',icon:'🌐',image:'nginx:alpine',port:'8080:80',desc:'Fast lightweight web server'},
{name:'Uptime Kuma',icon:'📈',image:'louislam/uptime-kuma:1',port:'3001:3001',desc:'Self-hosted monitoring dashboard'},
{name:'Syncthing',icon:'🔄',image:'syncthing/syncthing:latest',port:'8384:8384',desc:'Continuous file synchronization'},
{name:'Portainer CE',icon:'🐳',image:'portainer/portainer-ce:latest',port:'9000:9000',desc:'Docker management UI'},
{name:'Whoami',icon:'🧪',image:'traefik/whoami:latest',port:'8081:80',desc:'Tiny HTTP test service'},
{name:'File Browser',icon:'📁',image:'filebrowser/filebrowser:latest',port:'8082:80',desc:'Web file manager'}];
function renderStore(){const q=(document.getElementById('storefilter')?.value||'').toLowerCase();document.getElementById('store').innerHTML=storeApps.filter(a=>(a.name+a.desc).toLowerCase().includes(q)).map(a=>`<div class="app"><div class="apphead"><div class="appicon">${a.icon}</div><span class="pill">Docker</span></div><h3>${esc(a.name)}</h3><div class="muted">${esc(a.desc)}</div><div class="muted" style="margin-top:7px">${esc(a.image)} · ${esc(a.port)}</div><button class="btn primary" style="margin-top:12px" onclick="installStore('${esc(a.name)}','${esc(a.image)}','${esc(a.port)}')">Install</button></div>`).join('')}
async function installStore(name,image,port){const project=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const yaml=`services:\n  app:\n    image: ${image}\n    restart: unless-stopped\n    ports:\n      - "${port}"\n    volumes:\n      - /DATA/Apps/${project}/data:/data`;try{await api('/v1/docker/compose',{method:'POST',body:JSON.stringify({project,yaml})});toast(name+' installed');showAppTab('installed')}catch(e){toast('Install failed: '+e.message)}}
async function loadContainers(){try{const j=await api('/v1/docker/containers');state.containers=j.data||[];renderContainers()}catch(e){document.getElementById('containers').innerHTML='<div class="card empty">Docker unavailable: '+esc(e.message)+'</div>'}}
function renderContainers(){const q=(document.getElementById('appfilter')?.value||'').toLowerCase();const a=state.containers.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('containers').innerHTML=a.map(x=>{const id=x.ID||x.Id||'';const name=(x.Names||x.Name||id).replace(/^\//,'');const status=x.Status||'';const running=/up|running/i.test(status);return `<div class="app"><div class="apphead"><div class="appicon">▣</div><span class="pill ${running?'ok':'bad'}">${running?'Running':'Stopped'}</span></div><h3>${esc(name)}</h3><div class="muted">${esc(x.Image||'')}</div><div class="muted" style="margin-top:8px">${esc(status)}</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="containerAction('${esc(id)}','${running?'restart':'start'}')">${running?'Restart':'Start'}</button><button class="btn" onclick="containerLogs('${esc(id)}','${esc(name)}')">Logs</button><button class="btn" onclick="containerAction('${esc(id)}','${running?'stop':'start'}')">${running?'Stop':'Start'}</button></div></div>`}).join('')||'<div class="card empty">No containers found</div>'}
async function containerAction(id,a){try{await api('/v1/docker/containers/'+encodeURIComponent(id)+'/'+a,{method:'POST'});toast(a+' completed');loadContainers()}catch(e){toast(e.message)}}
async function containerLogs(id,name){try{const j=await api('/v1/docker/containers/'+encodeURIComponent(id)+'/logs?tail=300');showModal('<h2>'+esc(name)+' logs</h2><pre style="white-space:pre-wrap;background:var(--panel2);padding:12px;border-radius:10px;max-height:65vh;overflow:auto">'+esc(j.data||'')+'</pre><button class="btn" onclick="closeModal()">Close</button>')}catch(e){toast(e.message)}}
function composeModal(){showModal(`<h2>Deploy Compose project</h2><p class="muted">Compose files are stored under /DATA/Apps/&lt;project&gt; by default.</p><input class="input" id="cp" placeholder="Project name"><input class="input" style="margin-top:9px" id="cd" placeholder="Directory (optional)"><textarea class="textarea" style="margin-top:9px" id="cy">services:\n  web:\n    image: nginx:alpine\n    restart: unless-stopped\n    ports:\n      - "8080:80"</textarea><div class="actions" style="margin-top:10px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="deployCompose()">Deploy</button></div>`)}
async function deployCompose(){try{const j=await api('/v1/docker/compose',{method:'POST',body:JSON.stringify({project:document.getElementById('cp').value,directory:document.getElementById('cd').value,yaml:document.getElementById('cy').value})});closeModal();toast(j.data?.output||'Compose deployed');loadContainers()}catch(e){toast(e.message)}}
async function files(){header('Files','Browse server storage');document.getElementById('view').innerHTML=`<div class="toolbar"><input class="input" id="path" value="${esc(state.path)}"><button class="btn primary" onclick="loadFiles(document.getElementById('path').value)">Open</button><button class="btn" onclick="loadFiles(state.path)">Refresh</button><button class="btn" onclick="mkdirPrompt()">＋ Folder</button><button class="btn" onclick="uploadPrompt()">↑ Upload</button></div><div class="card"><div id="filelist"></div></div>`;loadFiles(state.path)}
async function loadFiles(path){try{const j=await api('/v1/folder?path='+encodeURIComponent(path)+'&index=1&size=500');state.path=path;state.files=j.data?.content||[];document.getElementById('path').value=path;document.getElementById('filelist').innerHTML=state.files.map(f=>`<div class="row"><span>${f.IsDir||f.is_dir?'📁':'📄'} <b>${esc(f.Name||f.name)}</b><span class="muted"> ${esc(f.Path||f.path)}</span></span><span>${f.IsDir||f.is_dir?'<button class="btn" onclick="loadFiles(\''+esc(f.Path||f.path).replaceAll("'","\\'")+ '\')">Open</button>':''}</span></div>`).join('')||'<div class="empty">Empty directory</div>'}catch(e){toast('Files: '+e.message)}}
async function mkdirPrompt(){const name=prompt('New folder name');if(!name)return;try{await api('/v1/folder',{method:'POST',body:JSON.stringify({path:state.path.replace(/\/$/,'')+'/'+name})});toast('Folder created');loadFiles(state.path)}catch(e){toast(e.message)}}
function uploadPrompt(){showModal(`<h2>Upload files</h2><input type="file" id="up" multiple><p class="muted">Uploads directly into ${esc(state.path)}</p><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="uploadFiles()">Upload</button></div>`)}
async function uploadFiles(){const fs=[...(document.getElementById('up')?.files||[])];if(!fs.length)return;try{for(const f of fs){const fd=new FormData();fd.append('file',f);fd.append('path',state.path);fd.append('relativePath',f.name);fd.append('filename',f.name);fd.append('chunkNumber','1');fd.append('totalChunks','1');const h={};if(state.token)h.Authorization=state.token.startsWith('Bearer ')?state.token:'Bearer '+state.token;const r=await fetch('/v1/file/upload',{method:'POST',headers:h,body:fd});if(!r.ok)throw new Error(await r.text())}closeModal();toast('Upload complete');loadFiles(state.path)}catch(e){toast('Upload failed: '+e.message)}}
async function gallery(){header('Gallery','Images and videos discovered in the current folder');document.getElementById('view').innerHTML=`<div class="toolbar"><input class="input small" id="gpath" value="${esc(state.path)}"><button class="btn primary" onclick="loadGallery()">Scan</button></div><div class="gallery" id="gallery"></div>`;loadGallery()}
async function loadGallery(){try{const p=document.getElementById('gpath').value;const j=await api('/v1/folder?path='+encodeURIComponent(p)+'&index=1&size=1000');const fs=j.data?.content||[];const media=fs.filter(f=>/\.(jpg|jpeg|png|gif|webp|bmp|mp4|webm|mov)$/i.test(f.Name||f.name));document.getElementById('gallery').innerHTML=media.map(f=>{const path=f.Path||f.path,name=f.Name||f.name;const img=/\.(mp4|webm|mov)$/i.test(name)?'<div style="padding:35px;text-align:center;font-size:35px">▶</div>':`<img loading="lazy" src="/v1/image?path=${encodeURIComponent(path)}">`;return `<div class="media">${img}<div>${esc(name)}</div></div>`}).join('')||'<div class="card empty">No media found in this folder. Use Files to browse another location.</div>'}catch(e){toast(e.message)}}
async function storage(){header('Storage','Mounted local and cloud storage');document.getElementById('view').innerHTML=`<div class="grid"><div class="card span8"><h3>Mounts</h3><div id="mounts"></div></div><div class="card span4"><h3>Cloud drivers</h3><div id="drivers"></div></div></div>`;try{const j=await api('/v1/cloud');document.getElementById('mounts').innerHTML=(j.data||[]).map(x=>`<div class="row"><span>◫ ${esc(x.Name||x.name||x.Path||x.path)}</span><span class="pill">${esc(x.Path||x.path||'')}</span></div>`).join('')||'<div class="empty">No mounts</div>'}catch(e){document.getElementById('mounts').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}try{const j=await api('/v1/driver');document.getElementById('drivers').innerHTML=(j.data||[]).map(x=>`<div class="row"><span>${esc(x.Name)}</span><button class="btn" onclick="window.open('${esc(x.AuthUrl||'#')}','_blank')">Connect</button></div>`).join('')}catch(e){document.getElementById('drivers').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function system(){header('System','Hardware, network, logs and lifecycle');document.getElementById('view').innerHTML=`<div class="grid"><div class="card span6"><h3>Hardware</h3><pre id="hw" class="muted" style="white-space:pre-wrap"></pre></div><div class="card span6"><h3>Network</h3><pre id="net" class="muted" style="white-space:pre-wrap"></pre></div><div class="card span12"><div class="toolbar"><h3 style="margin-right:auto">CasaOS logs</h3><button class="btn" onclick="loadLogs()">Refresh logs</button></div><pre id="logs" style="white-space:pre-wrap;max-height:400px;overflow:auto;background:var(--panel2);padding:12px;border-radius:10px"></pre></div><div class="card span12"><h3>Power</h3><div class="actions"><button class="btn" onclick="power('restart')">Restart server</button><button class="btn" onclick="power('off')">Shut down</button></div></div></div>`;try{const h=await api('/v1/sys/hardware');document.getElementById('hw').textContent=JSON.stringify(h.data,null,2)}catch(e){document.getElementById('hw').textContent=e.message}try{const n=await api('/v1/sys/net');document.getElementById('net').textContent=JSON.stringify(n.data,null,2)}catch(e){document.getElementById('net').textContent=e.message}loadLogs()}
async function loadLogs(){try{const j=await api('/v1/sys/logs?line=300');document.getElementById('logs').textContent=typeof j.data==='string'?j.data:JSON.stringify(j.data,null,2)}catch(e){document.getElementById('logs').textContent=e.message}}
async function power(a){if(!confirm('Are you sure you want to '+a+' the server?'))return;try{await api('/v1/sys/state/'+a,{method:'PUT'});toast('Command sent')}catch(e){toast(e.message)}}
function settings(){header('Settings','Personalize the control center and API connection');document.getElementById('view').innerHTML=`<div class="grid"><div class="card span6"><h3>Connection</h3><p class="muted">Use the JWT issued by your CasaOS authentication service.</p><input class="input" id="token" value="${esc(state.token)}" placeholder="Bearer token"><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="saveToken()">Save token</button><button class="btn" onclick="localStorage.removeItem('casa_token');state.token='';document.getElementById('token').value=''">Clear</button></div></div><div class="card span6"><h3>Appearance</h3><div class="row"><span>Theme</span><button class="btn" onclick="toggleTheme()">Toggle dark / light</button></div><div class="row"><span>Version</span><span class="pill">Zima-style UI</span></div></div><div class="card span12"><h3>Feature status</h3><div class="row"><span>Dashboard metrics</span><span class="pill ok">Live</span></div><div class="row"><span>Docker lifecycle + logs + Compose</span><span class="pill ok">Live</span></div><div class="row"><span>File manager</span><span class="pill ok">Live</span></div><div class="row"><span>Storage/cloud mounts</span><span class="pill ok">Live</span></div><div class="row"><span>Gallery browser</span><span class="pill ok">Live</span></div><div class="row"><span>RAID / fan policies / AI photo indexing / maps</span><span class="pill">Hardware/service dependent</span></div></div></div>`}
function saveToken(){state.token=document.getElementById('token').value.trim();localStorage.setItem('casa_token',state.token);toast('Token saved locally')}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('casa_theme',state.theme);document.documentElement.dataset.theme=state.theme}
function showModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function globalSearch(){showModal(`<h2>Spotlight Search</h2><input autofocus class="input" id="sq" placeholder="Search apps, files, settings..." oninput="searchAll()"><div id="results" class="row" style="display:block;margin-top:10px">Try: Docker, Files, Storage, System</div>`)}
function searchAll(){const q=document.getElementById('sq').value.toLowerCase();const hits=navItems.filter(x=>x[2].toLowerCase().includes(q));document.getElementById('results').innerHTML=hits.map(x=>`<div class="row"><span>${x[1]} ${x[2]}</span><button class="btn" onclick="closeModal();page('${x[0]}')">Open</button></div>`).join('')||'<div class="empty">No local results</div>'}
function refresh(){page(document.querySelector('.nav button.active')?.id?.slice(2)||'dashboard')}
